<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Universe Codex</title>
    <style>
        /* Base Dark Sci-Fi Theme */
        :root {
            --bg-dark: #0B0F19;
            --bg-card: #151C2C;
            --border-color: #2A354D;
            --marvel-red: #ED1D24;
            --marvel-accent: #00F0FF;
            --marvel-gold: #FFB800;
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--marvel-accent); }

        /* Header Bar */
        header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .logo-box {
            background: var(--marvel-red);
            color: #FFF;
            font-weight: 900;
            font-size: 18px;
            letter-spacing: -0.5px;
            padding: 4px 10px;
            border-radius: 4px;
            box-shadow: 0 4px 12px rgba(237, 29, 36, 0.4);
        }

        .brand-title {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            font-size: 10px;
            background: rgba(0, 240, 255, 0.1);
            color: var(--marvel-accent);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 2px 8px;
            border-radius: 12px;
            font-family: monospace;
        }

        /* Search Box */
        .search-container {
            flex: 1;
            max-width: 420px;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px 8px 36px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--marvel-accent);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 16px;
            height: 16px;
        }

        /* Nav Tabs */
        nav {
            background: rgba(21, 28, 44, 0.5);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--marvel-accent);
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        /* Filters & Grid */
        main {
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
            flex: 1;
        }

        .filter-bar {
            background: rgba(21, 28, 44, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        .filter-btn {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--marvel-accent);
            color: #000;
            font-weight: 700;
            border-color: var(--marvel-accent);
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 240, 255, 0.5);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        .card-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

        .emblem-icon {
            width: 28px;
            height: 28px;
            color: var(--marvel-accent);
        }

        /* Dossier Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 680px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s ease;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-card));
        }

        .close-btn {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
        }

        .close-btn:hover {
            border-color: var(--marvel-red);
            color: var(--marvel-red);
            transform: scale(1.1);
        }

        .modal-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            align-items: center;
        }

        .emblem-display {
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .emblem-display svg {
            width: 80px;
            height: 80px;
            color: var(--marvel-accent);
        }

        .bar-container {
            width: 100%;
            background: var(--bg-dark);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }

        .bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .bio-box {
            background: rgba(11, 15, 25, 0.4);
            border: 1px solid rgba(42, 53, 77, 0.5);
            border-radius: 12px;
            padding: 16px;
            font-size: 14px;
            line-height: 1.6;
            color: #CBD5E1;
        }

        /* Snap Particle Canvas */
        #snapCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- Particle Disintegration Canvas -->
    <canvas id="snapCanvas"></canvas>

    <!-- Header -->
    <header>
        <div style="display: flex; align-items: center; gap: 12px;">
            <div class="logo-box">MARVEL</div>
            <div class="brand-title">Universe Codex <span class="badge">v3.0</span></div>
        </div>

        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search operatives or realities (Press '/' to focus)...">
        </div>

        <button id="randomBtn" class="filter-btn" style="padding: 8px 16px;">🎲 Random Hero</button>
    </header>

    <!-- Navigation -->
    <nav>
        <div style="display: flex; gap: 8px;">
            <button class="tab-btn active">📁 Database</button>
            <button class="tab-btn">🌐 Reality Map</button>
            <button class="tab-btn">🛡️ Relics</button>
            <button class="tab-btn">👥 Factions</button>
        </div>
        <div style="font-size: 11px; font-family: monospace; color: var(--text-muted);">Hotkeys: [/ Search] [Esc Snap Close] [R Random]</div>
    </nav>

    <!-- Main View -->
    <main>
        <div class="filter-bar">
            <div style="display: flex; gap: 8px; align-items: center;">
                <span style="font-size: 12px; font-weight: 700; color: var(--text-muted);">REALITY:</span>
                <button data-filter="all" class="filter-btn active">All</button>
                <button data-filter="Earth-616" class="filter-btn">616 (Main)</button>
                <button data-filter="Earth-1610" class="filter-btn">1610 (Ultimate)</button>
                <button data-filter="Earth-65" class="filter-btn">65 (Spider-Gwen)</button>
                <button data-filter="Earth-928" class="filter-btn">2099</button>
                <button data-filter="Earth-2149" class="filter-btn">Zombies</button>
            </div>
            <div style="font-size: 12px; font-family: monospace; color: var(--marvel-accent);">
                Active Files: <span id="characterCount">0</span>
            </div>
        </div>

        <div id="characterGrid" class="character-grid">
            <!-- Rendered by JS -->
        </div>
    </main>

    <!-- Dossier Modal -->
    <div id="dossierModal" class="modal-overlay">
        <div id="modalCard" class="modal-card">
            <div class="modal-header">
                <div>
                    <span id="dossierUniverse" class="badge">EARTH-616</span>
                    <h2 id="dossierName" style="font-size: 24px; font-weight: 900; text-transform: uppercase; margin-top: 4px;">Hero Name</h2>
                    <p id="dossierAlias" style="font-size: 13px; color: var(--text-muted);">Real Name</p>
                </div>
                <button id="closeModalBtn" class="close-btn" title="Snap / Disintegrate (Esc)">✕</button>
            </div>

            <div class="modal-body">
                <div class="stat-grid">
                    <div class="emblem-display" id="dossierEmblem">
                        <!-- SVG Emblem -->
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <div>
                            <div style="display: flex; justify-content: space-between; font-size: 12px;"><span style="font-weight: 600;">Intelligence</span><span id="statInt">0/7</span></div>
                            <div class="bar-container"><div id="barInt" class="bar-fill" style="background: var(--marvel-accent);"></div></div>
                        </div>
                        <div>
                            <div style="display: flex; justify-content: space-between; font-size: 12px;"><span style="font-weight: 600;">Strength</span><span id="statStr">0/7</span></div>
                            <div class="bar-container"><div id="barStr" class="bar-fill" style="background: var(--marvel-red);"></div></div>
                        </div>
                        <div>
                            <div style="display: flex; justify-content: space-between; font-size: 12px;"><span style="font-weight: 600;">Speed</span><span id="statSpd">0/7</span></div>
                            <div class="bar-container"><div id="barSpd" class="bar-fill" style="background: var(--marvel-gold);"></div></div>
                        </div>
                    </div>
                </div>

                <div>
                    <h4 style="font-size: 11px; font-family: monospace; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase;">Tactical Dossier</h4>
                    <p id="dossierBio" class="bio-box">Biography details...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const characterData = [
            {
                id: "spiderman-616",
                name: "Spider-Man",
                alias: "Peter Parker",
                universe: "Earth-616",
                bio: "Bitten by a radioactive spider, Peter Parker gained the proportional strength and agility of an arachnid. Guided by the principle that with great power comes great responsibility, he protects New York.",
                stats: { int: 4, str: 4, spd: 4 },
                emblem: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15 8L21 9L16.5 13.5L18 19.5L12 16.5L6 19.5L7.5 13.5L3 9L9 8L12 2Z"/></svg>`
            },
            {
                id: "miles-1610",
                name: "Spider-Man",
                alias: "Miles Morales",
                universe: "Earth-1610",
                bio: "A teenager from Brooklyn who took up the mantle of Spider-Man following the death of his universe's Peter Parker. Possesses camouflage invisibility and venom blast shock abilities.",
                stats: { int: 3, str: 4, spd: 4 },
                emblem: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15 8L21 9L16.5 13.5L18 19.5L12 16.5L6 19.5L7.5 13.5L3 9L9 8L12 2Z"/></svg>`
            },
            {
                id: "spidergwen-65",
                name: "Ghost-Spider",
                alias: "Gwen Stacy",
                universe: "Earth-65",
                bio: "In Earth-65, Gwen Stacy was bitten by the genetically altered spider instead of Peter Parker, becoming the heroine known as Spider-Woman / Ghost-Spider.",
                stats: { int: 3, str: 3, spd: 4 },
                emblem: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15 8L21 9L16.5 13.5L18 19.5L12 16.5L6 19.5L7.5 13.5L3 9L9 8L12 2Z"/></svg>`
            },
            {
                id: "miguel-928",
                name: "Spider-Man 2099",
                alias: "Miguel O'Hara",
                universe: "Earth-928",
                bio: "A brilliant geneticist in Nueva York 2099 who inadvertently rewrote 50% of his DNA with spider genetic code, gaining talons, venomous fangs, and enhanced vision.",
                stats: { int: 5, str: 4, spd: 4 },
                emblem: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15 8L21 9L16.5 13.5L18 19.5L12 16.5L6 19.5L7.5 13.5L3 9L9 8L12 2Z"/></svg>`
            },
            {
                id: "ironman-616",
                name: "Iron Man",
                alias: "Tony Stark",
                universe: "Earth-616",
                bio: "Billionaire industrialist and genius engineer Tony Stark created a powered suit of armor to escape captivity, using his technical prowess to safeguard humanity.",
                stats: { int: 6, str: 6, spd: 5 },
                emblem: `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>`
            },
            {
                id: "wolverine-616",
                name: "Wolverine",
                alias: "Logan",
                universe: "Earth-616",
                bio: "A mutant endowed with animal-keen senses, enhanced physical capabilities, a powerful healing factor, and retractable adamantium-laced claws.",
                stats: { int: 2, str: 4, spd: 3 },
                emblem: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4L9 20M12 4L12 20M20 4L15 20"/></svg>`
            }
        ];

        let currentFilter = 'all';
        let searchQuery = '';

        document.addEventListener('DOMContentLoaded', () => {
            renderGrid();

            // Filters
            document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.getAttribute('data-filter');
                    renderGrid();
                });
            });

            // Search
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderGrid();
            });

            // Close Modal & Snap
            document.getElementById('closeModalBtn').addEventListener('click', snapClose);

            // Hotkeys
            window.addEventListener('keydown', (e) => {
                if (e.key === '/') {
                    e.preventDefault();
                    document.getElementById('searchInput').focus();
                } else if (e.key === 'Escape') {
                    snapClose();
                } else if (e.key.toLowerCase() === 'r') {
                    openModal(characterData[Math.floor(Math.random() * characterData.length)]);
                }
            });

            document.getElementById('randomBtn').addEventListener('click', () => {
                openModal(characterData[Math.floor(Math.random() * characterData.length)]);
            });
        });

        function renderGrid() {
            const grid = document.getElementById('characterGrid');
            grid.innerHTML = '';

            const list = characterData.filter(item => {
                const matchFilter = currentFilter === 'all' || item.universe === currentFilter;
                const matchSearch = item.name.toLowerCase().includes(searchQuery) || item.alias.toLowerCase().includes(searchQuery);
                return matchFilter && matchSearch;
            });

            document.getElementById('characterCount').textContent = list.length;

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(item);
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="badge">${item.universe}</span>
                            <div class="emblem-icon">${item.emblem}</div>
                        </div>
                        <h3 class="card-title">${item.name}</h3>
                        <p class="card-subtitle">${item.alias}</p>
                    </div>
                    <div style="margin-top: 16px; padding-top: 10px; border-top: 1px solid rgba(42,53,77,0.5); font-size: 11px; font-family: monospace; color: var(--marvel-accent);">OPEN FILE →</div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(item) {
            document.getElementById('dossierName').textContent = item.name;
            document.getElementById('dossierAlias').textContent = item.alias;
            document.getElementById('dossierUniverse').textContent = item.universe;
            document.getElementById('dossierBio').textContent = item.bio;
            document.getElementById('dossierEmblem').innerHTML = item.emblem;

            document.getElementById('statInt').textContent = item.stats.int + '/7';
            document.getElementById('barInt').style.width = (item.stats.int / 7 * 100) + '%';
            document.getElementById('statStr').textContent = item.stats.str + '/7';
            document.getElementById('barStr').style.width = (item.stats.str / 7 * 100) + '%';
            document.getElementById('statSpd').textContent = item.stats.spd + '/7';
            document.getElementById('barSpd').style.width = (item.stats.spd / 7 * 100) + '%';

            document.getElementById('dossierModal').classList.add('active');
        }

        function snapClose() {
            const modal = document.getElementById('dossierModal');
            if (!modal.classList.contains('active')) return;

            const card = document.getElementById('modalCard');
            const canvas = document.getElementById('snapCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const rect = card.getBoundingClientRect();
            const particles = [];

            for (let i = 0; i < 350; i++) {
                particles.push({
                    x: rect.left + Math.random() * rect.width,
                    y: rect.top + Math.random() * rect.height,
                    vx: (Math.random() - 0.2) * 3,
                    vy: (Math.random() - 0.8) * 4,
                    size: Math.random() * 3 + 1,
                    alpha: 1
                });
            }

            modal.classList.remove('active');

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    if (p.alpha > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.alpha -= 0.02;

                        ctx.globalAlpha = Math.max(0, p.alpha);
                        ctx.fillStyle = '#888888';
                        ctx.fillRect(p.x, p.y, p.size, p.size);
                    }
                });

                if (alive) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            animate();
        }
    </script>
</body>
</html>
